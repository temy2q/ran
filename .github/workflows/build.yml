name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout or create builds branch
        run: |
          cd $GITHUB_WORKSPACE
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          if git clone --branch builds --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git builds 2>/dev/null; then
            echo "Checked out existing builds branch"
            rm -f builds/*.cs3 builds/*.jar builds/plugins.json builds/repo.json 2>/dev/null || true
          else
            echo "Builds branch does not exist yet — creating it"
            mkdir -p builds
            cd builds
            git init
            git checkout -b builds
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            echo "# Builds" > README.md
            git add README.md
            git commit -m "Initial builds branch"
            git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git push origin builds
            cd ..
            echo "Builds branch created successfully"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp **/build/*.jar $GITHUB_WORKSPACE/builds/ || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ || true
          echo "--- Build output ---"
          ls -la $GITHUB_WORKSPACE/builds/

      - name: Generate repo.json
        run: |
          REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/builds"
          cat > $GITHUB_WORKSPACE/builds/repo.json << EOF
          {
              "name": "Library of Ladev",
              "description": "Neuro-sama Stream Transcript Search - Browse & search VTuber stream clips with YouTube playback",
              "manifestVersion": 1,
              "pluginLists": [
                  "${REPO_URL}/plugins.json"
              ]
          }
          EOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --staged --quiet && echo "No changes to push" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin builds
